name: 'gh-slack-notify'
description: 'Send GitHub events to Slack with thread replies and daily summaries'
author: 'ut61z'

branding:
  icon: 'message-circle'
  color: 'purple'

inputs:
  event_type:
    description: 'Event type: pull_request, issues, workflow_run, or summary'
    required: true
  slack_token:
    description: 'Slack Bot Token (xoxb-...)'
    required: true
  slack_channel:
    description: 'Slack channel ID (C01234567)'
    required: true
  github_token:
    description: 'GitHub Token for API access and state management'
    required: true
  label_filter_mode:
    description: 'Label filter mode: whitelist or blacklist'
    required: false
    default: ''
  filter_labels:
    description: 'Comma-separated labels to filter (e.g., "notify-slack" or "wip,draft")'
    required: false
    default: ''
  exclude_project_issues:
    description: 'Exclude issues linked to GitHub Projects'
    required: false
    default: 'true'
  workflow_names:
    description: 'Comma-separated workflow names to notify (for workflow_run events)'
    required: false
    default: ''
  notify_on:
    description: 'When to notify for workflow_run: success,failure or failure'
    required: false
    default: 'success,failure'
  base_branches:
    description: 'Target base branches to notify (e.g., "main", "main,develop", or "all" for all branches)'
    required: false
    default: 'all'
  encryption_key:
    description: 'Encryption key for state data (base64-encoded 32 bytes). Required unless debug_mode is true.'
    required: false
    default: ''
  debug_mode:
    description: 'Enable debug mode (disables encryption). For local development only.'
    required: false
    default: 'false'

outputs:
  message_ts:
    description: 'Slack message timestamp (for thread replies)'
  notified:
    description: 'Whether a notification was sent (true/false)'

runs:
  using: 'node24'
  main: 'dist/index.js'
