name: Daily Summary

on:
  schedule:
    # 平日（月〜金）日本時間23:00（UTC 14:00）に実行
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
    # 手動実行も可能

permissions:
  contents: write
  actions: write

jobs:
  summary:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./
        with:
          event_type: summary
          slack_token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack_channel: ${{ secrets.SLACK_CHANNEL_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
