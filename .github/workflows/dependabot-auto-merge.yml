name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2.5.0

      - if: steps.metadata.outputs.package-ecosystem == 'bun'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}

      - if: steps.metadata.outputs.package-ecosystem == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Rebuild dist
        if: steps.metadata.outputs.package-ecosystem == 'bun'
        run: |
          bun install --frozen-lockfile
          bun run build
          git diff --quiet -- dist && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: distを再ビルド"
          git push
          # GITHUB_TOKENによるpushではpull_requestイベントが発火しないため、必須チェックのCIを明示的に起動する
          gh workflow run ci.yml --ref "$HEAD_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}

      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
